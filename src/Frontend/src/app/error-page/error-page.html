<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 px-4">
    <div class="text-center">
        <h1 class="text-9xl font-bold text-gray-300 dark:text-gray-600">404</h1>
        <h2 class="text-3xl font-semibold text-gray-800 dark:text-white mt-4">
            Page Not Found
        </h2>
        <p class="text-gray-600 dark:text-gray-400 mt-2 max-w-md mx-auto">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="mt-8 flex gap-4 justify-center">
            <button
                (click)="goHome()"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors"
            >
                Go to Gallery
            </button>
            <a
                routerLink="/"
                class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-bold py-3 px-6 rounded-lg transition-colors"
            >
                Home
            </a>
        </div>
    </div>
</div>

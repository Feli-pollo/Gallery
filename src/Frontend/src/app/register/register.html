<div class="register-page">
    <div class="pokeball-bg"></div>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <span class="logo-poke">Poke</span><span class="logo-gallery">
                    <span class="letter-g">G</span><span class="letter-a1">a</span><span class="letter-l1">l</span><span class="letter-l2">l</span><span class="letter-e">e</span><span class="letter-r">r</span><span class="letter-y">y</span>
                </span>
                <p class="register-subtitle">Create an account to share fanart</p>
            </div>

            @if (error()) {
                <div class="error-message">
                    {{ error() }}
                </div>
            }

            <form (ngSubmit)="register()" class="register-form">
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input
                        type="text"
                        [(ngModel)]="username"
                        name="username"
                        required
                        class="form-input"
                        placeholder="Choose a username"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input
                        type="email"
                        [(ngModel)]="email"
                        name="email"
                        required
                        class="form-input"
                        placeholder="your@email.com"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Display Name</label>
                    <input
                        type="text"
                        [(ngModel)]="displayName"
                        name="displayName"
                        class="form-input"
                        placeholder="Your display name (optional)"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input
                        type="password"
                        [(ngModel)]="password"
                        name="password"
                        required
                        class="form-input"
                        placeholder="At least 6 characters"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input
                        type="password"
                        [(ngModel)]="confirmPassword"
                        name="confirmPassword"
                        required
                        class="form-input"
                        placeholder="Repeat your password"
                    />
                </div>

                <button
                    type="submit"
                    [disabled]="isLoading()"
                    class="btn-submit"
                >
                    @if (isLoading()) {
                        <span>Creating account...</span>
                    } @else {
                        <span>Register</span>
                    }
                </button>
            </form>

            <p class="login-link">
                Already have an account?
                <a routerLink="/login">Sign in here</a>
            </p>
        </div>
    </div>
</div>

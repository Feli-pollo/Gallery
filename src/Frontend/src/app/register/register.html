<div class="register-page">
    <div class="pokeball-bg"></div>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <span class="logo-text">Poke</span><span class="logo-accent">Gallery</span>
                <p class="register-subtitle">Crea tu cuenta para compartir fanarts</p>
            </div>

            @if (error()) {
                <div class="error-message">
                    {{ error() }}
                </div>
            }

            <form (ngSubmit)="register()" class="register-form">
                <div class="form-group">
                    <label class="form-label">Usuario *</label>
                    <input
                        type="text"
                        [(ngModel)]="username"
                        name="username"
                        required
                        class="form-input"
                        placeholder="Elige un nombre de usuario"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input
                        type="email"
                        [(ngModel)]="email"
                        name="email"
                        required
                        class="form-input"
                        placeholder="tu@email.com"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Nombre para mostrar</label>
                    <input
                        type="text"
                        [(ngModel)]="displayName"
                        name="displayName"
                        class="form-input"
                        placeholder="Tu nombre (opcional)"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Contraseña *</label>
                    <input
                        type="password"
                        [(ngModel)]="password"
                        name="password"
                        required
                        class="form-input"
                        placeholder="Mínimo 6 caracteres"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmar Contraseña *</label>
                    <input
                        type="password"
                        [(ngModel)]="confirmPassword"
                        name="confirmPassword"
                        required
                        class="form-input"
                        placeholder="Repite tu contraseña"
                    />
                </div>

                <button
                    type="submit"
                    [disabled]="isLoading()"
                    class="btn-submit"
                >
                    @if (isLoading()) {
                        <span>Creando cuenta...</span>
                    } @else {
                        <span>Registrarse</span>
                    }
                </button>
            </form>

            <p class="login-link">
                ¿Ya tienes cuenta?
                <a routerLink="/login">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>

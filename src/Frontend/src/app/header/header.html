<header class="header">
    <div class="header-content">
        <a routerLink="/gallery" class="logo">
            <span class="logo-text">Poke</span><span class="logo-accent">Gallery</span>
        </a>

        <nav class="nav-links">
            <a routerLink="/gallery" class="nav-link">Explorar</a>
            <a class="nav-link">Regiones</a>
            <a class="nav-link">Favoritos</a>
        </nav>

        <div class="header-actions">
            <app-search (findSearch)="findSearch($event)"></app-search>
            <button class="btn-logout" (click)="logout()">Salir</button>
        </div>
    </div>
</header>

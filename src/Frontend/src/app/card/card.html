<div class="card-wrapper" [style.animation-delay]="animationDelay">
    <div class="card" [ngStyle]="gradientStyle">
        <!-- Shimmer effect overlay -->
        <div class="card-shimmer"></div>

        <!-- Type badge -->
        <div class="type-badge">
            {{ typeNames }}
        </div>

        <!-- Pokemon name -->
        <div class="card-header">
            <span class="pokedex-number">#{{ currentCard.pokedexNumber }}</span>
            <h2 class="pokemon-name">{{ currentCard.nombre }}</h2>
        </div>

        <!-- Image container -->
        <div class="image-container">
            <img
                [src]="currentCard.imagen"
                [alt]="currentCard.nombre"
                class="pokemon-image"
                loading="lazy"
            />
        </div>

        <!-- Action buttons -->
        <div class="card-actions">
            <button class="btn-primary" (click)="exploreFanart()">
                <span class="btn-icon">🖼️</span>
                <span>Explorar Fanart</span>
            </button>

            <div class="btn-row">
                <button class="btn-secondary" (click)="uploadFanart()">
                    <span class="btn-icon">➕</span>
                    <span>Subir</span>
                </button>
                <button class="btn-icon-only" (click)="toggleFavorite($event)" title="Añadir a favoritos">
                    ❤️
                </button>
            </div>
        </div>
    </div>
</div>

<div class="login-page">
    <div class="pokeball-bg"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="logo-poke">Poke</span><span class="logo-gallery">
                    <span class="letter-g">G</span><span class="letter-a1">a</span><span class="letter-l1">l</span><span class="letter-l2">l</span><span class="letter-e">e</span><span class="letter-r">r</span><span class="letter-y">y</span>
                </span>
                <p class="login-subtitle">Sign in to explore fanart</p>
            </div>

            @if (error()) {
                <div class="error-message">
                    {{ error() }}
                </div>
            }

            <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">
                        Username
                    </label>
                    <input
                        name="user"
                        [(ngModel)]="username"
                        required
                        type="text"
                        placeholder="Enter your username"
                        class="form-input"
                    />
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <input
                        name="password"
                        [(ngModel)]="password"
                        required
                        type="password"
                        placeholder="Enter your password"
                        class="form-input"
                    />
                </div>

                <button
                    type="submit"
                    [disabled]="loginForm.invalid || isLoading()"
                    class="btn-submit"
                >
                    @if (isLoading()) {
                        <span>Signing in...</span>
                    } @else {
                        <span>Sign In</span>
                    }
                </button>
            </form>

            <p class="register-link">
                Don't have an account?
                <a routerLink="/register">Register here</a>
            </p>
        </div>
    </div>
</div>

name: Deploy VibeGallery to VPS

on:
  push:
    branches: [commandCode]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: vibegallery-RackNerd
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/feli-pollo/vibegallery-backend
  FRONTEND_IMAGE: ghcr.io/feli-pollo/vibegallery-frontend

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: RackNerd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Frontend
        run: npm install

      # - name: Test frontend
      #   working-directory: src/Frontend
      #   run: npm test -- --watch=false

      - name: Build frontend
        working-directory: src/Frontend
        run: npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build backend
        run: dotnet build src/Backend/Backend.csproj --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
            
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          token_json="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deploy.kity.dev")"
          oidc_token="$(printf '%s' "$token_json" | jq -r '.value')"
          printf 'token=%s\n' "$oidc_token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend through VPS broker
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST "https://deploy.kity.dev/api/deployments/vibe-gallery-frontend" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg oidc_token "$OIDC_TOKEN" \
              --arg image "$IMAGE" \
              --arg ghcr_username "${{ github.repository_owner }}" \
              --arg ghcr_token "$GHCR_TOKEN" \
              --arg git_sha "${{ github.sha }}" \
              '{oidc_token:$oidc_token,image:$image,ghcr_username:$ghcr_username,ghcr_token:$ghcr_token,git_sha:$git_sha}')"

      - name: Deploy backend through VPS broker
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST "https://deploy.kity.dev/api/deployments/vibe-gallery-backend" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg oidc_token "$OIDC_TOKEN" \
              --arg image "$IMAGE" \
              --arg ghcr_username "${{ github.repository_owner }}" \
              --arg ghcr_token "$GHCR_TOKEN" \
              --arg git_sha "${{ github.sha }}" \
              '{oidc_token:$oidc_token,image:$image,ghcr_username:$ghcr_username,ghcr_token:$ghcr_token,git_sha:$git_sha}')"
              